<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{{ title }} · LDA Phishing Study</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="SPIT ML Research home">
        <span class="brand-mark" aria-hidden="true">LDA</span>
        <span class="brand-copy"><strong>SPIT · ML Research</strong><small>Phishing website classification</small></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="/" {% if page == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        <a href="/dataset" {% if page == 'dataset' %}aria-current="page"{% endif %}>Dataset</a>
        <a href="/methodology" {% if page == 'methodology' %}aria-current="page"{% endif %}>Methodology</a>
        <a href="/evaluation" {% if page == 'evaluation' %}aria-current="page"{% endif %}>Evaluation</a>
        <a href="/predict" {% if page == 'predict' %}aria-current="page"{% endif %}>Demo</a>
      </nav>
    </div>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="footer-inner"><span><strong>SPIT · Machine Learning Research</strong></span><span>Local demonstration · LDA phishing classification</span></div></footer>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
